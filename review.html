<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>เฉลยร่วมกัน - Food Detective Challenge</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='52'%3E%F0%9F%A5%97%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="teacher-body">
  <main class="teacher-dashboard review-dashboard">
    <section class="teacher-hero review-hero">
      <div>
        <p class="mission-label">After Mission</p>
        <h1>📚 เฉลยร่วมกัน</h1>
        <p class="hero-copy">เปิดหน้านี้หลังเล่นจบ เพื่อทบทวนคำศัพท์ คำตอบของแต่ละกลุ่ม และเฉลยที่ถูกต้อง</p>
      </div>
      <a class="teacher-review-link" href="teacher.html">กลับหน้าคะแนน</a>
    </section>

    <section class="review-controls panel">
      <div>
        <h2>เลือกกลุ่มสำหรับเฉลย</h2>
        <p id="reviewStatus">กำลังโหลดคำตอบ...</p>
      </div>
      <div id="reviewGroupButtons" class="review-group-buttons"></div>
    </section>

    <section id="reviewFocus" class="review-focus panel"></section>

    <section class="review-table-card panel">
      <div class="review-table-header">
        <h2>คำตอบทั้งหมด</h2>
        <div class="review-table-actions">
          <button id="downloadReviewBtn" class="report-print-button" type="button">ดาวน์โหลดเฉลย</button>
          <button id="printReviewBtn" class="report-print-button" type="button">พิมพ์หน้าเฉลย</button>
        </div>
      </div>
      <div id="reviewTableWrap" class="review-table-wrap"></div>
    </section>
  </main>

  <script src="review.js"></script>
</body>
</html>
