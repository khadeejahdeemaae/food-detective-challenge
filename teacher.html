<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teacher Scoreboard</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='52'%3E%F0%9F%8F%86%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="teacher-body">
  <main class="teacher-dashboard">
    <section class="teacher-hero">
      <div>
        <p class="mission-label">Teacher Screen</p>
        <h1>🏆 Food Detective Scores</h1>
        <p class="hero-copy">เปิดหน้านี้ไว้บนเครื่องครู คะแนนจะอัปเดตเมื่อนักเรียนเล่นจบ</p>
      </div>
      <button id="resetScoresBtn" class="primary-button teacher-reset" type="button">ล้างคะแนน</button>
    </section>

    <section class="teacher-links panel">
      <div class="teacher-link-copy">
        <h2>ลิงก์สำหรับนักเรียน</h2>
        <p id="studentLink">กำลังโหลดลิงก์...</p>
        <p class="small-note">ให้นักเรียนสแกน QR Code จากหน้าจอนี้ หรือเปิดลิงก์บนแท็บเล็ต</p>
      </div>
      <div class="qr-card">
        <img id="studentQr" alt="QR Code สำหรับเข้าเกม" />
        <strong>Scan to Play</strong>
      </div>
    </section>

    <section class="winner-board panel">
      <div class="winner-board-header">
        <h2>🎉 อันดับผู้ชนะ</h2>
        <p id="winnerMessage">รอคะแนนจากนักเรียน...</p>
      </div>
      <div id="teacherPodium" class="teacher-podium"></div>
    </section>

    <section id="teacherScores" class="teacher-score-grid"></section>
  </main>

  <script src="teacher.js"></script>
</body>
</html>
